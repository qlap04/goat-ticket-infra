name: "Infrastructure Delivery - $(Build.SourceBranchName) - $(Date:yyyyMMdd)$(Rev:.r)"

trigger: none

pr:
  branches:
    include:
      - develop
      - main
      - release/*
  paths:
    include:
      - deploy/bicep/**
      - deploy/pipeline/**
      - deploy/templates/**
      - deploy/variables/**

parameters:
  - name: azureLocation
    displayName: "Deployment metadata location (must match the .bicepparam)"
    type: string
    default: southeastasia

  - name: environments
    displayName: "Environments to deliver, in order"
    type: object
    default:
      - environment: dev
        environmentName: goat-dev

pool:
  vmImage: ubuntu-24.04

stages:
  - ${{ each env in parameters.environments }}:
      - stage: Infra_${{ env.environment }}
        displayName: "Deliver infrastructure to ${{ upper(env.environment) }}"
        jobs:
          - template: ../templates/deploy-infra-jobs.yml
            parameters:
              environment: ${{ env.environment }}
              environmentName: ${{ env.environmentName }}
              deployJobName: InfraDeploy_${{ env.environment }}
              repository: self

              azureServiceConnection: goat-ticket-connection
              azureSubscriptionId: 3a69333f-bef6-45a8-9206-f82c71e24d70
              azureLocation: ${{ parameters.azureLocation }}
              bicepVersion: 0.47.16

              stackName: stack-goat-dev

              actionOnUnmanageResources: detach
              actionOnUnmanageResourceGroups: detach

              denySettingsMode: none

              bypassStackOutOfSyncError: false
