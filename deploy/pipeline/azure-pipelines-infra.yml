name: "Deploy Infra - $(Build.SourceBranchName) - $(Date:yyyyMMdd)$(Rev:.r)"

trigger: none

parameters:
  - name: deployNetwork
    displayName: "Deploy network"
    type: boolean
    default: false

  # Mock object shared by every environment; it becomes the Bicep parameter "abc" (resource group tags).
  - name: abcobject
    displayName: "Resource group tags"
    type: object
    default:
      owner: goat-team

pool:
  vmImage: ubuntu-24.04

# One stage per environment, in the order written. Each stage starts after the one before it succeeds.
stages:
  #DEV
  - stage: Infra_dev
    displayName: "Deliver infra to DEV"
    dependsOn: []
    jobs:
      - template: templates/deploy-infra-jobs.yml
        parameters:
          environment: dev
          repository: self
          deployNetwork: ${{ parameters.deployNetwork }}
          abcobject: ${{ parameters.abcobject }}

  #SIT
  - stage: Infra_sit
    displayName: "Deliver infra to SIT"
    dependsOn: Infra_dev
    jobs:
      - template: templates/deploy-infra-jobs.yml
        parameters:
          environment: sit
          repository: self
          deployNetwork: ${{ parameters.deployNetwork }}
          abcobject: ${{ parameters.abcobject }}

  #UAT
  - stage: Infra_uat
    displayName: "Deliver infra to UAT"
    dependsOn: Infra_sit
    jobs:
      - template: templates/deploy-infra-jobs.yml
        parameters:
          environment: uat
          repository: self
          deployNetwork: ${{ parameters.deployNetwork }}
          abcobject: ${{ parameters.abcobject }}

  #PREPROD
  - stage: Infra_preprod
    displayName: "Deliver infra to PREPROD"
    dependsOn: Infra_uat
    jobs:
      - template: templates/deploy-infra-jobs.yml
        parameters:
          environment: preprod
          repository: self
          deployNetwork: ${{ parameters.deployNetwork }}
          abcobject: ${{ parameters.abcobject }}

  #PROD
  - stage: Infra_prod
    displayName: "Deliver infra to PROD"
    dependsOn: Infra_preprod
    jobs:
      - template: templates/deploy-infra-jobs.yml
        parameters:
          environment: prod
          repository: self
          deployNetwork: ${{ parameters.deployNetwork }}
          abcobject: ${{ parameters.abcobject }}
