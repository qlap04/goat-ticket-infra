parameters:
  - name: environment
    type: string

  - name: repository
    type: string
    values:
      - self
      - InfraRepo

  # Env specific values -> Bicep parameter "abc". 
  - name: abcobject
    type: object

  # all deploys both resource groups; app skips rg-network. Becomes the Bicep parameter "deployScope".
  - name: deployScope
    type: string
    default: all
    values:
      - all
      - app

jobs:
  - job: InfraDeploy_${{ parameters.environment }}_Checks
    displayName: "Check ${{ upper(parameters.environment) }} Infra"
    variables:
      - template: environment-variables.yml
        parameters:
          environment: ${{ parameters.environment }}

      # the .bicepparam files read it.
      - name: ABC_JSON
        value: ${{ convertToJson(parameters.abcobject) }}
      - name: DEPLOY_SCOPE
        value: ${{ parameters.deployScope }}

    steps:
      - checkout: ${{ parameters.repository }}
        fetchDepth: 1

        # Validate
      - task: BicepDeploy@0
        displayName: "Validate"
        inputs:
          type: deploymentStack
          operation: validate
          scope: subscription
          azureResourceManagerConnection: goat-ticket-connection
          subscriptionId: $(subscriptionId)
          location: $(location)
          bicepVersion: $(bicepVersion)
          name: $(stackName)
          templateFile: $(Build.SourcesDirectory)/deploy/bicep/main.bicep
          parametersFile: $(Build.SourcesDirectory)/deploy/variables/${{ parameters.environment }}.bicepparam
          actionOnUnmanageResources: detach
          actionOnUnmanageResourceGroups: detach
          denySettingsMode: none
          bypassStackOutOfSyncError: false

        # Security Scan
      - task: MicrosoftSecurityDevOps@1
        displayName: "Security Scan"
        inputs:
          tools: checkov
          categories: IaC
          break: false

        # What-if
      - task: AzureCLI@2
        displayName: "Preview Infra (What-if)"
        inputs:
          azureSubscription: goat-ticket-connection
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            az stack-whatif sub create \
              --name "whatif-$(stackName)" \
              --location "$(location)" \
              --stack-id "/subscriptions/$(subscriptionId)/providers/Microsoft.Resources/deploymentStacks/$(stackName)" \
              --template-file "$(Build.SourcesDirectory)/deploy/bicep/main.bicep" \
              --parameters "$(Build.SourcesDirectory)/deploy/variables/${{ parameters.environment }}.bicepparam" \
              --action-on-unmanage detachAll \
              --deny-settings-mode none \
              --retention-interval P1D


  # Deploy
  - deployment: InfraDeploy_${{ parameters.environment }}
    displayName: "Deploy ${{ upper(parameters.environment) }} Infra"
    dependsOn: InfraDeploy_${{ parameters.environment }}_Checks
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    environment: goat-${{ parameters.environment }}
    variables:
      - template: environment-variables.yml
        parameters:
          environment: ${{ parameters.environment }}
      - name: ABC_JSON
        value: ${{ convertToJson(parameters.abcobject) }}
      - name: DEPLOY_SCOPE
        value: ${{ parameters.deployScope }}
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: ${{ parameters.repository }}
              fetchDepth: 1

            - task: BicepDeploy@0
              displayName: "Deploy infrastructure to ${{ upper(parameters.environment) }}"
              inputs:
                type: deploymentStack
                operation: create
                scope: subscription
                azureResourceManagerConnection: goat-ticket-connection
                subscriptionId: $(subscriptionId)
                location: $(location)
                bicepVersion: $(bicepVersion)
                name: $(stackName)
                templateFile: $(Build.SourcesDirectory)/deploy/bicep/main.bicep
                parametersFile: $(Build.SourcesDirectory)/deploy/variables/${{ parameters.environment }}.bicepparam
                actionOnUnmanageResources: detach
                actionOnUnmanageResourceGroups: detach
                denySettingsMode: none
                bypassStackOutOfSyncError: false
