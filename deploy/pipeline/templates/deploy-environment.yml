parameters:
  - name: environment
    type: string
    values:
      - dev
      - prod
  - name: dependsOn
    type: object
    default: []

stages:
  - stage: Deploy${{ parameters.environment }}
    displayName: "Deploy infrastructure to the ${{ iif(eq(parameters.environment, 'prod'), 'production', 'development') }} environment"
    dependsOn: ${{ parameters.dependsOn }}
    jobs:
      - deployment: DeployInfra${{ parameters.environment }}
        displayName: "Deploy infrastructure to the ${{ iif(eq(parameters.environment, 'prod'), 'production', 'development') }} environment"
        environment: "goat-${{ parameters.environment }}"
        variables:
          - group: goat-ticket-secrets-${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: "Preview and apply infrastructure changes"
                  inputs:
                    azureSubscription: "goat-ticket-connection"
                    scriptType: "bash"
                    scriptLocation: "scriptPath"
                    scriptPath: "deploy/script/deploy-environment.sh"
                    arguments: "${{ parameters.environment }} deploy/variables/${{ parameters.environment }}.bicepparam"
                  env:
                    TICKET_QR_SIGNING_KEY_VALUE: $(ticketQrSigningKeyValue)
                    KEY_VAULT_CERT_SECRET_URI: $(keyVaultCertSecretUri)
