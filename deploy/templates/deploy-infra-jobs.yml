parameters:
  - name: environment # dev, sit, uat, preprod, prod
    type: string
  - name: target
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: azureSubscription
    type: string
    default: goat-ticket-connection
  - name: subscriptionId
    type: string
    default: 919a17b8-76d4-471b-9c13-d1370b6e1da2
  - name: location
    type: string
    default: southeastasia

jobs:
  # ===== Job 1: INFRA CHECK =====
  - job: InfraChecks_${{ parameters.environment }}
    displayName: "Check infrastructure changes for ${{ parameters.environment }}"
    dependsOn: ${{ parameters.dependsOn }}
    steps:
      - checkout: InfraRepo
        fetchDepth: 1
      #VALIDATE
      - task: BicepDeploy@0
        displayName: "Validate infrastructure changes against Azure"
        inputs:
          type: deployment
          operation: validate
          scope: subscription
          azureResourceManagerConnection: ${{ parameters.azureSubscription }}
          subscriptionId: ${{ parameters.subscriptionId }}
          location: ${{ parameters.location }}
          templateFile: $(Build.SourcesDirectory)/deploy/bicep/main.bicep
          parametersFile: $(Build.SourcesDirectory)/deploy/variables/${{ parameters.target }}.bicepparam
        env:
          TICKET_QR_SIGNING_KEY_VALUE: $(ticketQrSigningKeyValue)
          KEY_VAULT_CERT_SECRET_URI: $(keyVaultCertSecretUri)

      #SECURITY
      - task: MicrosoftSecurityDevOps@1
        displayName: "Scan infrastructure code for security issues"
        inputs:
          tools: "checkov"
          categories: "IaC"
          break: false

      #WHAT-IF
      - task: BicepDeploy@0
        displayName: "Preview infrastructure changes"
        inputs:
          type: deployment
          operation: whatIf
          scope: subscription
          azureResourceManagerConnection: ${{ parameters.azureSubscription }}
          subscriptionId: ${{ parameters.subscriptionId }}
          location: ${{ parameters.location }}
          templateFile: $(Build.SourcesDirectory)/deploy/bicep/main.bicep
          parametersFile: $(Build.SourcesDirectory)/deploy/variables/${{ parameters.target }}.bicepparam
        env:
          TICKET_QR_SIGNING_KEY_VALUE: $(ticketQrSigningKeyValue)
          KEY_VAULT_CERT_SECRET_URI: $(keyVaultCertSecretUri)

  # ===== Job 2: GATE Yes/No =====
  - job: InfraGate_${{ parameters.environment }}
    displayName: "Decide whether to deploy infrastructure to ${{ parameters.environment }}"
    dependsOn: InfraChecks_${{ parameters.environment }}
    pool: server
    steps:
      - task: ManualValidation@0
        displayName: "Apply infrastructure changes to ${{ parameters.environment }}?"
        timeoutInMinutes: 1440
        continueOnError: true
        inputs:
          instructions: "Review the preview result in the log of job Infra checks. Resume to deploy infrastructure, Reject to skip it."
          onTimeout: reject

  # ===== Job 3: DEPLOY =====
  - job: InfraDeploy_${{ parameters.environment }}
    displayName: "Deploy infrastructure to ${{ parameters.environment }}"
    dependsOn:
      - InfraChecks_${{ parameters.environment }}
      - InfraGate_${{ parameters.environment }}
    condition: and(succeeded('InfraChecks_${{ parameters.environment }}'), eq(dependencies.InfraGate_${{ parameters.environment }}.result, 'Succeeded'))
    steps:
      - checkout: InfraRepo
        fetchDepth: 1
      - task: BicepDeploy@0
        displayName: "Deploy infrastructure to ${{ parameters.environment }}"
        inputs:
          type: deployment
          operation: create
          scope: subscription
          azureResourceManagerConnection: ${{ parameters.azureSubscription }}
          subscriptionId: ${{ parameters.subscriptionId }}
          location: ${{ parameters.location }}
          name: infra-${{ parameters.environment }}
          templateFile: $(Build.SourcesDirectory)/deploy/bicep/main.bicep
          parametersFile: $(Build.SourcesDirectory)/deploy/variables/${{ parameters.target }}.bicepparam
        env:
          TICKET_QR_SIGNING_KEY_VALUE: $(ticketQrSigningKeyValue)
          KEY_VAULT_CERT_SECRET_URI: $(keyVaultCertSecretUri)
