parameters:
  - name: environment
    type: string
    values:
      - dev
      - sit
      - uat
      - preprod
      - prod

  - name: deployJobName
    type: string

  - name: environmentName
    type: string

  - name: repository
    type: string
    values:
      - self
      - InfraRepo

  - name: azureServiceConnection
    type: string

  - name: azureSubscriptionId
    type: string

  - name: azureLocation
    type: string

  - name: bicepVersion
    type: string

  - name: stackName
    type: string

  - name: actionOnUnmanageResources
    type: string
    values:
      - detach
      - delete

  - name: actionOnUnmanageResourceGroups
    type: string
    values:
      - detach
      - delete

  - name: denySettingsMode
    type: string
    values:
      - none
      - denyDelete
      - denyWriteAndDelete

  - name: bypassStackOutOfSyncError
    type: boolean

jobs:
  - job: ${{ parameters.deployJobName }}_Checks
    displayName: "Check infrastructure changes for ${{ upper(parameters.environment) }}"
    timeoutInMinutes: 30
    steps:

      - checkout: ${{ parameters.repository }}
        fetchDepth: 1

      - task: BicepDeploy@0
        displayName: "Validate infrastructure changes against Azure"
        inputs:
          type: deploymentStack
          operation: validate
          scope: subscription
          azureResourceManagerConnection: ${{ parameters.azureServiceConnection }}
          subscriptionId: ${{ parameters.azureSubscriptionId }}
          location: ${{ parameters.azureLocation }}
          bicepVersion: ${{ parameters.bicepVersion }}
          name: ${{ parameters.stackName }}
          templateFile: $(Build.SourcesDirectory)/deploy/bicep/main.bicep
          parametersFile: $(Build.SourcesDirectory)/deploy/variables/${{ parameters.environment }}.bicepparam
          actionOnUnmanageResources: ${{ parameters.actionOnUnmanageResources }}
          actionOnUnmanageResourceGroups: ${{ parameters.actionOnUnmanageResourceGroups }}
          denySettingsMode: ${{ parameters.denySettingsMode }}
          bypassStackOutOfSyncError: ${{ parameters.bypassStackOutOfSyncError }}

      - task: MicrosoftSecurityDevOps@1
        displayName: "Scan infrastructure code for security issues"
        inputs:
          tools: checkov
          categories: IaC
          break: false
          publish: true

      - task: BicepDeploy@0
        displayName: "Preview infrastructure changes"
        inputs:
          type: deploymentStack
          operation: whatIf
          scope: subscription
          azureResourceManagerConnection: ${{ parameters.azureServiceConnection }}
          subscriptionId: ${{ parameters.azureSubscriptionId }}
          location: ${{ parameters.azureLocation }}
          bicepVersion: ${{ parameters.bicepVersion }}
          name: ${{ parameters.stackName }}
          templateFile: $(Build.SourcesDirectory)/deploy/bicep/main.bicep
          parametersFile: $(Build.SourcesDirectory)/deploy/variables/${{ parameters.environment }}.bicepparam
          actionOnUnmanageResources: ${{ parameters.actionOnUnmanageResources }}
          actionOnUnmanageResourceGroups: ${{ parameters.actionOnUnmanageResourceGroups }}
          denySettingsMode: ${{ parameters.denySettingsMode }}
          bypassStackOutOfSyncError: ${{ parameters.bypassStackOutOfSyncError }}

  - deployment: ${{ parameters.deployJobName }}
    displayName: "Deploy infrastructure to ${{ upper(parameters.environment) }}"
    dependsOn: ${{ parameters.deployJobName }}_Checks
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    timeoutInMinutes: 90
    environment: ${{ parameters.environmentName }}
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: ${{ parameters.repository }}
              fetchDepth: 1

            - task: BicepDeploy@0
              displayName: "Deploy infrastructure to ${{ upper(parameters.environment) }}"
              inputs:
                type: deploymentStack
                operation: create
                scope: subscription
                azureResourceManagerConnection: ${{ parameters.azureServiceConnection }}
                subscriptionId: ${{ parameters.azureSubscriptionId }}
                location: ${{ parameters.azureLocation }}
                bicepVersion: ${{ parameters.bicepVersion }}
                name: ${{ parameters.stackName }}
                templateFile: $(Build.SourcesDirectory)/deploy/bicep/main.bicep
                parametersFile: $(Build.SourcesDirectory)/deploy/variables/${{ parameters.environment }}.bicepparam
                actionOnUnmanageResources: ${{ parameters.actionOnUnmanageResources }}
                actionOnUnmanageResourceGroups: ${{ parameters.actionOnUnmanageResourceGroups }}
                denySettingsMode: ${{ parameters.denySettingsMode }}
                bypassStackOutOfSyncError: ${{ parameters.bypassStackOutOfSyncError }}
