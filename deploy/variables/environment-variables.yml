parameters:
  - name: environment
    type: string

variables:
  # Mock example: dev001 uses the prod values
  - ${{ if or(eq(parameters.environment, 'prod'), eq(parameters.environment, 'dev001')) }}:
      - name: armConnection
        value: goat-ticket-connection
      - name: subscriptionId
        value: 3a69333f-bef6-45a8-9206-f82c71e24d70
      - name: location
        value: southeastasia
      - name: bicepVersion
        value: 0.47.16
      - name: stackName
        value: stack-goat-prod
  - ${{ else }}:
      - name: armConnection
        value: goat-ticket-connection
      - name: subscriptionId
        value: 3a69333f-bef6-45a8-9206-f82c71e24d70
      - name: location
        value: southeastasia
      - name: bicepVersion
        value: 0.47.16
      - name: stackName
        value: stack-goat-dev
