# Infrastructure delivery pipeline. It runs on its own, without the application pipeline.
# - Pull requests run the checks only (validate, security scan, preview). The template never
#   deploys a pull request build.
# - Production approval and the "only from main" rule are configured on the Azure DevOps
#   Environments (Approvals and checks), not in this file.

name: "Infrastructure Delivery - $(Build.SourceBranchName) - $(Date:yyyyMMdd)$(Rev:.r)"

trigger: none

pr:
  branches:
    include:
      - develop
      - main
      - release/*
  paths:
    include:
      - deploy/bicep/**
      - deploy/environments/**
      - deploy/pipeline/**
      - deploy/templates/**
      - deploy/variables/**

parameters:
  - name: environment
    displayName: "Environment to deliver"
    type: string
    default: dev
    values:
      - dev
      - sit
      - uat
      - preprod
      - prod

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: Infra_${{ parameters.environment }}
    displayName: "Deploy infra to ${{ parameters.environment }}"
    jobs:
      - template: ../environments/${{ parameters.environment }}.yml
        parameters:
          deployJobName: InfraDeploy_${{ parameters.environment }}
          repository: self
