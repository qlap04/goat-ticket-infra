name: "Deploy Infra - $(Build.SourceBranchName) - $(Date:yyyyMMdd)$(Rev:.r)"

trigger: none

parameters:
  - name: environments
    displayName: "Environments to deliver, in order"
    type: object
    default:
      - environment: dev
      - environment: sit
      - environment: uat
      - environment: preprod

  - name: deployScope
    displayName: "Resource groups to deploy"
    type: string
    default: app
    values:
      - all
      - app

pool:
  vmImage: ubuntu-24.04

stages:
  - ${{ each env in parameters.environments }}:
      - stage: Infra_${{ env.environment }}
        displayName: "Deliver infrastructure to ${{ upper(env.environment) }}"
        jobs:
          - template: templates/deploy-infra-jobs.yml
            parameters:
              environment: ${{ env.environment }}
              repository: self
              deployScope: ${{ parameters.deployScope }}

              # Mock object shared by every environment; it becomes the Bicep parameter "abc" (resource group tags).
              abcobject:
                owner: goat-team
