name: "Deploy Infra - $(Build.SourceBranchName) - $(Date:yyyyMMdd)$(Rev:.r)"

trigger: none

parameters:
  - name: deployScope
    displayName: "Resource groups to deploy"
    type: string
    default: app
    values:
      - all
      - app

pool:
  vmImage: ubuntu-24.04

variables:
  - template: templates/branch-environment.yml

stages:
  - ${{ if ne(variables.environment, '') }}:
      - stage: Infra_${{ variables.environment }}
        displayName: "Deliver infrastructure to ${{ upper(variables.environment) }}"
        jobs:
          - template: templates/deploy-infra-jobs.yml
            parameters:
              environment: ${{ variables.environment }}
              repository: self
              deployScope: ${{ parameters.deployScope }}

              # Mock object shared by every environment; it becomes the Bicep parameter "abc" (resource group tags).
              abcobject:
                owner: goat-team
