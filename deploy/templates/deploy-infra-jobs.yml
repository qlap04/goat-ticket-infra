parameters:
  - name: environment          # logical environment: dev, sit, uat, preprod, prod
    type: string

  - name: adoEnvironment       # Azure DevOps Environment the deploy job binds to (approvals live there)
    type: string

  - name: deployJobName        # name of the final job; the caller depends on exactly this name
    type: string

  - name: azureSubscription
    type: string
    default: goat-ticket-connection

  - name: subscriptionId
    type: string
    default: 919a17b8-76d4-471b-9c13-d1370b6e1da2

  - name: location
    type: string
    default: southeastasia
  # Infra-owned settings per environment: the only place where concrete names live.
  # Mock: every environment still uses the dev parameter file and the dev secrets.
  - name: settings
    type: object
    default:
      dev:
        parameterFile: dev
        secretGroup: goat-ticket-secrets-dev
      sit:
        parameterFile: dev
        secretGroup: goat-ticket-secrets-dev
      uat:
        parameterFile: dev
        secretGroup: goat-ticket-secrets-dev
      preprod:
        parameterFile: dev
        secretGroup: goat-ticket-secrets-dev
      prod:
        parameterFile: dev
        secretGroup: goat-ticket-secrets-dev

jobs:
  # Checks only read and preview, so a plain job is enough
  - job: ${{ parameters.deployJobName }}_Checks
    displayName: "Check infrastructure changes for ${{ parameters.environment }}"
    variables:
      # Infra secrets are scoped to the infra jobs only
      - group: ${{ parameters.settings[parameters.environment].secretGroup }}
    steps:
      - checkout: InfraRepo
        fetchDepth: 1

      - task: BicepDeploy@0
        displayName: "Validate infrastructure changes against Azure"
        inputs:
          type: deployment
          operation: validate
          scope: subscription
          azureResourceManagerConnection: ${{ parameters.azureSubscription }}
          subscriptionId: ${{ parameters.subscriptionId }}
          location: ${{ parameters.location }}
          templateFile: $(Build.SourcesDirectory)/deploy/bicep/main.bicep
          parametersFile: $(Build.SourcesDirectory)/deploy/variables/${{ parameters.settings[parameters.environment].parameterFile }}.bicepparam
        env:
          TICKET_QR_SIGNING_KEY_VALUE: $(ticketQrSigningKeyValue)
          KEY_VAULT_CERT_SECRET_URI: $(keyVaultCertSecretUri)

      - task: MicrosoftSecurityDevOps@1
        displayName: "Scan infrastructure code for security issues"
        inputs:
          tools: "checkov,templateanalyzer"
          categories: "IaC"
          break: false

      - task: BicepDeploy@0
        displayName: "Preview infrastructure changes"
        inputs:
          type: deployment
          operation: whatIf
          scope: subscription
          azureResourceManagerConnection: ${{ parameters.azureSubscription }}
          subscriptionId: ${{ parameters.subscriptionId }}
          location: ${{ parameters.location }}
          templateFile: $(Build.SourcesDirectory)/deploy/bicep/main.bicep
          parametersFile: $(Build.SourcesDirectory)/deploy/variables/${{ parameters.settings[parameters.environment].parameterFile }}.bicepparam
        env:
          TICKET_QR_SIGNING_KEY_VALUE: $(ticketQrSigningKeyValue)
          KEY_VAULT_CERT_SECRET_URI: $(keyVaultCertSecretUri)

  
  - deployment: ${{ parameters.deployJobName }}
    displayName: "Deploy infrastructure to ${{ parameters.environment }}"
    dependsOn: ${{ parameters.deployJobName }}_Checks
    environment: ${{ parameters.adoEnvironment }}
    variables:
      - group: ${{ parameters.settings[parameters.environment].secretGroup }}
    strategy:
      runOnce:
        deploy:
          steps:
            # Deployment jobs do not check out any repository by default
            - checkout: InfraRepo
              fetchDepth: 1

            - task: BicepDeploy@0
              displayName: "Deploy infrastructure to ${{ parameters.environment }}"
              inputs:
                type: deployment
                operation: create
                scope: subscription
                azureResourceManagerConnection: ${{ parameters.azureSubscription }}
                subscriptionId: ${{ parameters.subscriptionId }}
                location: ${{ parameters.location }}
                name: infra-${{ parameters.environment }}
                templateFile: $(Build.SourcesDirectory)/deploy/bicep/main.bicep
                parametersFile: $(Build.SourcesDirectory)/deploy/variables/${{ parameters.settings[parameters.environment].parameterFile }}.bicepparam
              env:
                TICKET_QR_SIGNING_KEY_VALUE: $(ticketQrSigningKeyValue)
                KEY_VAULT_CERT_SECRET_URI: $(keyVaultCertSecretUri)